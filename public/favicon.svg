<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <!-- Benzene / Hex ring orbit -->
  <polygon points="32,10 50,20 50,44 32,54 14,44 14,20" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Central Carbon node -->
  <circle cx="32" cy="32" r="14" fill="#0284c7"/>
  <text x="32" y="38" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff">C</text>
  <!-- Satellite Hydrogen electrons -->
  <circle cx="32" cy="10" r="4" fill="#2dd4bf"/>
  <circle cx="50" cy="44" r="4" fill="#2dd4bf"/>
  <circle cx="14" cy="44" r="4" fill="#2dd4bf"/>
</svg>
